; Ganti had kecil lalai PHP supaya muat naik Excel/gambar yang munasabah
; (cth: import Guru/Pelajar) tidak gagal senyap.
upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120

; OPcache — penting untuk prestasi production (PHP tidak perlu parse semula
; fail setiap request).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Production tidak perlu paparkan ralat PHP mentah di skrin (Laravel sendiri
; uruskan paparan ralat melalui APP_DEBUG).
display_errors = Off
log_errors = On

; Mitigasi tambahan PHP2Shell (CVE-2026-109619) — aplikasi tidak guna
; jejak kemajuan muat naik sesi.
session.upload_progress.enabled = 0
